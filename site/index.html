<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>little camera — a 1-bit microblog pocket camera</title>
<meta name="description" content="0.07 megapixel • 1-bit color • 28-day battery • beeps • little blog included">
<link rel="canonical" href="https://lttl.cam/">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#dddddd">
<!-- The device, in ink on the page's own paper. Inline so there is no second
     request and no 404 for /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23dddddd'/%3E%3Crect%20x='4'%20y='9'%20width='24'%20height='15'%20rx='2.5'%20fill='%23000000'/%3E%3C/svg%3E">

<!-- Everything lower case, the way the page itself is set. The card image is
     a real frame of this page rather than a mock-up: same ground, same
     dither, same glitched headline. -->
<meta property="og:site_name" content="lttl.cam">
<meta property="og:title" content="little camera — a 1-bit microblog pocket camera">
<meta property="og:description" content="0.07 megapixel • 1-bit color • 28-day battery • beeps • little blog included">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lttl.cam/">
<meta property="og:locale" content="en">
<meta property="og:image" content="https://lttl.cam/media/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="a small dithered camera beside the words a little camera is coming.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="little camera — a 1-bit microblog pocket camera">
<meta name="twitter:description" content="0.07 megapixel • 1-bit color • 28-day battery • beeps • little blog included">
<meta name="twitter:image" content="https://lttl.cam/media/og.png">
<meta name="twitter:image:alt" content="a small dithered camera beside the words a little camera is coming.">
<!-- The headline is fitted by measuring the font that actually resolved, so a
     late-arriving PP Neue Montreal makes it visibly re-fit. Preloading the two
     faces costs 125 KB up front and removes that jump; `crossorigin` is
     required even same-origin, since fonts are fetched in CORS mode and
     without it the browser fetches each file twice. -->
<link rel="preload" href="fonts/ppneuemontreal-bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/ppneuemontreal-book.woff" as="font" type="font/woff" crossorigin>
<style>
/* lttl.cam — teaser.
   Ground and type are Amaranth Studio's: #ddd paper, PP Neue Montreal. The
   font files are licensed and live beside this page in fonts/; nothing else
   can serve them, so the stack falls back to the nearest grotesque and the
   headline measures whatever actually resolved (see the script). The headline
   is the one place that departs from the micro-blog's tiny tracked caps — at
   display size a bold grotesque wants tight tracking, not wide. */
@font-face{font-family:"PP Neue Montreal Book";
  src:url("fonts/ppneuemontreal-book.woff") format("woff");
  font-weight:400; font-style:normal; font-display:swap}
@font-face{font-family:"PP Neue Montreal Bold";
  src:url("fonts/ppneuemontreal-bold.woff") format("woff");
  font-weight:700; font-style:normal; font-display:swap}
:root{
  --ink:#000; --paper:#ddd; --rule:1px solid #000;
  --font:"PP Neue Montreal Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-bold:"PP Neue Montreal Bold","PP Neue Montreal Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --shell:#dadada; --shell-lit:#efefef; --shell-dim:#c3c3c3;
  --glass:#fff; --cast:0,0,0;
  --pad-x:clamp(20px, 5vw, 72px);
  /* The block: as wide as the screen allows, capped so it stays whole above
     the fold on a laptop. The headline is fitted to it at runtime (see the
     script): sizing it by calculation meant guessing the font's metrics, and
     Helvetica Neue Bold on iOS is a shade wider than Helvetica or Arial, so
     its longest line wrapped there and the three lines became four. The
     factor below is only the pre-script fallback, deliberately short.

     The whole stack is about 1.5 measures tall, so the height cap is what
     keeps it inside one screen. It is svh, the viewport at its smallest: dvh
     would resize the composition every time a mobile URL bar slid away, and
     each resize re-fits the headline. The vh line above it is the fallback
     for browsers without svh, and is the same number. */
  --sheet:min(calc(100vw - var(--pad-x) * 2), 480px, 48vh);
  --sheet:min(calc(100vw - var(--pad-x) * 2), 480px, 48svh);
  /* The 2.7" Sharp panel is 57.6 x 34.56 mm of glass, and 1.75 mm of bezel at
     3 mm of bezel all round makes the device 63.6 x 40.6 x 7 mm. There is no
     chin: the border is the same width on every side, and the body is only as
     tall as that makes it. Every proportion below comes off that rectangle. */
  --w:calc(var(--sheet) * 0.88);
  --h:calc(var(--w) * 0.6377);
  --d:calc(var(--w) * 0.1101);
  --r:calc(var(--w) * 0.055);
  --burst:calc(var(--w) * 0.30);   /* the price sticker over the top right corner */
  --gutter:8px;                    /* the page's margin around the bento */
  --bento:16px;                    /* its corner radius */
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%}
body{
  /* svh, not dvh: dvh tracks the bars as they slide, so every scroll on a
     phone would change this height and move the credit with it. */
  min-height:100vh; min-height:100svh;
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font);
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding:var(--gutter);
}
img{max-width:100%}

/* The camera sits above the headline. The markup keeps the h1 first, so the
   document still opens with its own title and a screen reader meets the words
   before the ornament; column-reverse does the flip visually. margin:auto
   rather than centring on the body, because a flex container centred with
   align-items clips the top of anything taller than it, and on a very short
   window this composition should scroll rather than lose its head. */
/* Everything that moves lives in one rounded box: the ground, the wash and
   the composition on top of them. The header stays outside it.

   flex:1 0 auto, not a height: the box fills the first screen and will push
   whatever comes after it down the page rather than shrinking to make room.
   No z-index -- it is not a stacking context, so the title's blend still
   reaches the ground inside it. overflow:hidden is what the radius needs to
   bite on the two full-bleed layers below. */
.bento{position:relative; flex:1 0 auto; overflow:hidden;
       border-radius:var(--bento);
       display:flex; flex-direction:column}

/* The box's ground, dithered. Absolute rather than fixed, so the radius clips
   it; the device's canvas reads the same field in the same box coordinates,
   so the two share one unbroken dot pattern. */
/* The box's shadow, dithered like everything else -- a soft grey box-shadow
   would be the one piece of the page that is not made of dots. It is its own
   canvas because the ground above lives inside the box and cannot paint
   outside it. Absolute rather than fixed: fixed pinned it to the viewport and
   it stayed put while the box scrolled away from under it. Placed in document
   coordinates, so it travels with the box for free and never repaints on
   scroll. */
.shade{position:absolute; display:block; pointer-events:none;
       image-rendering:pixelated; image-rendering:crisp-edges}

.vig{position:absolute; left:0; top:0; display:block;
     image-rendering:pixelated; image-rendering:crisp-edges}

/* No z-index. The sheet only needs to paint after the ground, which document
   order already does, and a z-index would make it a stacking context -- which
   would trap the title's blend inside it, against nothing. */
.sheet{position:relative; width:var(--sheet); margin:auto;
       display:flex; flex-direction:column-reverse; align-items:flex-start;
       gap:calc(var(--sheet) * 0.12)}

/* A recording of this very page, zoomed until the dither came apart, running
   at full strength as a block behind the headline, with the words inverted on
   top of it.

   The inversion is the blend: white letters in difference mode come out as
   255 minus whatever the film is doing behind each one, so they are always the
   exact opposite of their own backdrop and can never sink into it, however the
   film moves. Isolate keeps that reckoning inside the title, against the film,
   rather than against the ground the title sits on.

   The film is masked down to the three lines, each band only as wide as its
   own line, so it reads as a selected surface rather than a panel. The mask is
   three solid gradient layers, one per line, placed and sized from the lines'
   own boxes once the headline has been fitted -- a clip-path cannot describe
   three disjoint rectangles, and three video elements would mean three
   decoders. The bands are bled a little past the line boxes, because the
   leading is 0.72 and the letters overflow them.

   The heading is padded for the same reason, to take those letters back in. The film's width and height are set rather than left to the insets:
   a video is a replaced element, so width:auto takes its own 540x926 instead
   of stretching. */
/* Multiply, so the white of the words becomes whatever the ground is under
   them -- its grey, its dither, its gradient -- while the block's black stays
   black. Isolate on the same element keeps the inversion inside from taking
   part: the difference blend resolves first, at full strength, and only the
   finished block is multiplied onto the page. */
.title{position:relative; isolation:isolate; width:100%;
       mix-blend-mode:darken}
.film{position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; pointer-events:none;
      /* Back to two values. The clip is 1-bit to begin with, but the encode,
         the chroma subsampling and the scale on the way to the screen turn
         its two levels into a spread -- and a spread laid over a dithered
         ground gives muddy half-tones where there should be dots. Enormous
         contrast is a threshold: everything either side of mid-grey clamps,
         so what comes out is black or white and nothing between. Grayscale
         first, because a subsampled encode of grey is not exactly grey. */
      filter:grayscale(1) contrast(2000%);
      image-rendering:pixelated; image-rendering:crisp-edges}
.title h1{position:relative; padding-block:.14em;
          color:#fff; mix-blend-mode:exclusion}
@media (prefers-reduced-motion:reduce){
  .film{display:none}
  .title h1{color:var(--ink); mix-blend-mode:normal}
}

/* The same film again, over the whole page and barely there: enough that the
   paper reads as a shade rather than a flat fill. A second element and so a
   second decoder, which is the price of having the film at two strengths at
   once -- one element cannot be in two places.

   A radial mask holds it back over the middle, where the camera and the words
   are, and lets it up towards the edges. It stays flat at about a tenth out to
   60%, where the camera and the words live, so the middle is one even wash
   rather than a gradient of its own, and climbs to full at the corners. Under the sheet, so the words and
   the camera sit on top of it. */
/* Absolute in the box, not fixed to the viewport: it used to be overscanned
   by 40px top and bottom against lvh so an iOS bar sliding away could not
   uncover its edge. The box has a settled height of its own, so it can simply
   fill it. */
/* The threshold lands on black and white, and then brightness pulls the white
   down to the paper: 221/255. That is what keeps the wash from ever being
   brighter than the ground it is shading -- at plain opacity a white pixel used
   to compute 0.86 x ground + 0.14 x 255, which came out above the page's own
   221. A paper-valued pixel composites to paper at any opacity, so the ceiling
   holds by construction and the opacity is free to carry the texture.
   mix-blend-mode:multiply would do this more exactly, and on the ground's black
   dots it would leave them alone where this lifts them; it is not used because
   a blended layer over a full-screen video breaks the page on iOS Safari --
   both on the video itself and on a wrapping div. */
/* The opacity, the blend and the mask are on a wrapping div; the <video>
   carries only object-fit and the threshold.

   The blend is load-bearing beyond how it looks. A bare video is
   hardware-composited, and WebKit then paints it without the opacity, the mask
   or much else this rule asks for -- Safari rendered the wash at full strength
   across the middle where Firefox and Chromium kept it to the edges. Hiding
   .wash was the one thing that made Safari correct, which is what identified
   it. A mix-blend-mode forces the subtree to be rendered and blended rather
   than handed to the compositor, and the wash comes right. Don't remove it
   without checking Safari; overlay is not only a look. */
.wash{position:absolute; inset:0; overflow:hidden;
      opacity:.28; pointer-events:none;
      -webkit-mask-image:radial-gradient(78% 58% at 50% 46%,
            rgba(0,0,0,.10) 0%, rgba(0,0,0,.10) 60%, #000 100%);
      mask-image:radial-gradient(78% 58% at 50% 46%,
            rgba(0,0,0,.10) 0%, rgba(0,0,0,.10) 60%, #000 100%)}
.wash video{display:block; width:100%; height:100%; object-fit:cover;
      filter:grayscale(1) contrast(2000%) brightness(.867);
      image-rendering:pixelated; image-rendering:crisp-edges}
/* Safari only: -webkit-named-image() is WebKit's own and Blink dropped it, so
   this is false in Chrome and in Firefox. The blend is not a look here, it is
   the fix -- see the note above. It is scoped because it is not free: overlay
   screens against a backdrop lighter than mid-grey, so where the other engines
   hold the wash at or below the paper, Safari's runs a little brighter. Better
   one engine slightly light than one engine wrong. */
@supports (background: -webkit-named-image(i)){
  .wash{mix-blend-mode:overlay}
}
@media (prefers-reduced-motion:reduce){ .wash{display:none} }

/* A header that is only a button: where a site would put its call to action,
   so the page reads as a product page rather than a poster. It does nothing
   yet, and both the disabled attribute and the cursor say so.

   Fixed, so it stays where it is once there is enough page to scroll. Twice
   the gutter on every side: the box is already inset by one, and this keeps
   the button the same distance inside it as an absolute bar gave. Fixed also
   takes it out of the box's clip, which is what lets it sit over content
   passing underneath. Its 4px radius is set rather than derived from the
   box's: the button is the tighter corner of the two here, not a proportion
   of it. */
.bar{position:fixed; top:calc(var(--gutter) * 2);
     left:calc(var(--gutter) * 2); right:calc(var(--gutter) * 2);
     display:flex; justify-content:flex-end; align-items:center;
     /* The one z-index on the page. The sheet is positioned too and comes
        later in the markup, so document order alone paints the camera and the
        badge over this the moment anything scrolls under it -- which is the
        whole reason the bar is fixed. Safe here because .bar is a sibling of
        the sheet, not an ancestor: the stacking context it makes is nowhere
        near the title's blend. */
     z-index:2}
.pre{border:0; border-radius:4px; margin:0;
     padding:calc(var(--sheet) * 0.030) calc(var(--sheet) * 0.052);
     font-family:var(--font-bold); font-weight:700;
     font-size:calc(var(--sheet) * 0.050); line-height:1;
     letter-spacing:-.012em;
     color:var(--paper); background:var(--ink); cursor:not-allowed}

/* The words, as one block. Full width so the headline fitter, which measures
   against its parent, still gets the measure. */
.say{width:100%; display:flex; flex-direction:column; align-items:flex-start;
     gap:calc(var(--sheet) * 0.038)}

/* Lower case, like every heading on amaranthstudio.com. The micro-blog's
   tracked capitals are right at 10px and wrong at 90. */
h1{margin:0; text-align:left; font-family:var(--font-bold);
   font-size:calc(var(--sheet) * 0.168); line-height:.72; font-weight:700;
   letter-spacing:-.012em}
/* Each line is its own block and never wraps, so three lines stay three lines
   whatever the font turns out to be. */
h1 span{display:block; width:fit-content; white-space:nowrap}

/* Quieter than the headline by weight as well as size, so it reads as a
   footnote rather than a fourth line -- but set solid, on hard black, where
   the headline is film and inversion.

   The band is on an inline span inside the paragraph, not on the paragraph
   itself: a flex item is blockified, so a background there would run the full
   measure instead of hugging the words. Inline, it breaks with the text and
   each line gets its own band, which box-decoration-break gives its own
   padding too. At 1.4 the leading is just under the banded line's own height
   (1em plus twice .16em of padding), so the bands meet instead of sitting
   apart: two lines read as one black block, the way the headline does. */
.by{margin:0; font-family:var(--font); font-weight:400;
    font-size:calc(var(--sheet) * 0.048); line-height:1.4}
.by span{background:var(--ink); color:var(--paper);
         padding:.16em .34em;
         -webkit-box-decoration-break:clone; box-decoration-break:clone}
.by a{color:inherit; text-decoration:none}

/* ---- the void ---- */
.stage{position:relative; width:var(--w); align-self:center;
       display:flex; align-items:center; justify-content:center;
       perspective:1500px; perspective-origin:50% 45%;
       min-height:calc(var(--h) + var(--w) * 0.14)}
.rig{transform-style:preserve-3d; animation:bob 6.5s ease-in-out infinite; will-change:transform}
/* It is always turning a little, so the full turn below reads as more of the
   same motion rather than something switching on. */
.sway{transform-style:preserve-3d; animation:sway 11s ease-in-out infinite; will-change:transform}
.cast{position:absolute; left:50%; bottom:calc(var(--w) * 0.02);
      width:calc(var(--w) * 0.8); height:calc(var(--w) * 0.09);
      border-radius:50%; background:rgb(var(--cast));
      filter:blur(calc(var(--w) * 0.045));
      animation:cast 6.5s ease-in-out infinite; will-change:transform,opacity}

@keyframes bob{0%,100%{transform:translateY(calc(var(--w) * -0.022)) rotate(-.5deg)}
               50%   {transform:translateY(calc(var(--w) *  0.022)) rotate(.5deg)}}
@keyframes sway{0%,100%{transform:rotateY(-11deg) rotateX(-3.5deg)}
                50%   {transform:rotateY(10deg)  rotateX(3.5deg)}}
@keyframes cast{0%,100%{transform:translateX(-50%) scale(1.08); opacity:.12}
                50%   {transform:translateX(-50%) scale(.9);   opacity:.25}}

/* ---- the device ---- */
.box{position:relative; width:var(--w); height:var(--h); transform-style:preserve-3d;
     transform:rotateX(-5deg) rotateY(var(--spin,0deg));
     transition:transform 1.25s cubic-bezier(.62,.02,.34,1)}
.slice{position:absolute; left:0; top:0; width:var(--w); height:var(--h);
       border-radius:var(--r); transform:translateZ(calc(var(--d) * var(--z)))}
/* The one thing on the back, up in the top left. Mirrored from the renderer's
   placement, because the fallback shows the back from the front's handedness. */
.lens{position:absolute; left:6.8%; top:9.5%; width:13.5%; aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle at 38% 34%,#4c4c4c 0%,#1a1a1a 44%,#080808 100%);
      box-shadow:0 0 0 calc(var(--w) * .008) var(--shell-dim),
                 0 0 0 calc(var(--w) * .0115) rgba(0,0,0,.2)}
.lens::after{content:""; position:absolute; left:25%; top:19%; width:23%; aspect-ratio:1;
             border-radius:50%; background:rgba(255,255,255,.62)}

.slab{position:absolute; left:0; top:0; width:var(--w); height:var(--h);
      border-radius:var(--r); backface-visibility:hidden;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.front{transform:translateZ(calc(var(--d) / 2));
       background:linear-gradient(158deg,var(--shell-lit) 0%,var(--shell) 52%,var(--shell-dim) 100%)}
.back{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));
      background:linear-gradient(202deg,var(--shell-lit) 0%,var(--shell) 58%,var(--shell-dim) 100%)}

/* The panel: 3 mm of bezel on every side, with corners of its own. */
.screen{position:absolute; inset:7.40% 4.72%;
        border:var(--rule); border-radius:calc(var(--r) * .5);
        background:var(--glass); overflow:hidden}
.screen img{display:block; width:100%; height:100%; image-rendering:pixelated;
            border-radius:calc(var(--r) * .44)}

/* The dithered render. When WebGL comes up it takes over and the CSS device
   below is hidden; if it doesn't, the CSS device stays and nothing is lost. */
.gl{position:absolute; inset:0; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges}
/* A phone is twice as tall as it is wide and needs room the camera did not.
   The canvas takes it from the slack the sheet is centred in, rather than from
   the stage: growing the stage reflows the page and the composition loses its
   head on a short window. */
.stage.phone .gl{top:calc(var(--w) * -0.19); bottom:calc(var(--w) * -0.09)}
.stage:not(.gl-on) .gl{display:none}
.gl-on .rig,.gl-on .cast{display:none}

/* ---- the price ---- */
/* A sticker over the device's top right corner. The device is centred in the
   stage and spans 94% of its width, so its corner sits 0.03w in from the right,
   and its top edge (0.6377 + k - 0.5995) / 2 down, where k is the extra height
   the stage carries above the device -- 0.089w as that stands. Change the one
   and this follows. The sticker's centre is pulled a little inside the corner,
   which reads as stuck on rather than balanced on it, and keeps it off the
   viewport edge on a narrow phone. The device turns and bobs under it; the
   sticker stays put rather than tracking the corner. */
.burst{position:absolute; width:var(--burst); height:var(--burst);
       right:calc(var(--w) * 0.07 - var(--burst) / 2);
       top:calc(var(--w) * 0.05 - var(--burst) / 2);
       display:grid; place-items:center; pointer-events:none;
       transition:opacity 300ms ease}
/* The sticker is pinned to the camera's top right corner, and the phone has
   no corner there to sit on. */
.stage.phone .burst{opacity:0}
/* The points are rounded by stroking the star in its own fill with a round
   join, rather than by a path of arcs: one number to tune, and the tips keep
   the same radius however many points there are. The stroke grows the shape by
   half its width, which is why the path stops short of the viewBox.
   Sixteen points, and the indents only go from r42 to r36.5 -- shallow enough
   that it reads as a badge with a scalloped edge rather than a star. */
.burst svg{position:absolute; inset:0; width:100%; height:100%;
           fill:var(--ink); stroke:var(--ink);
           stroke-width:9; stroke-linejoin:round}
/* The path turns, not the <svg>. Rotating the element would swing its own
   axis-aligned box out to sqrt(2) of its width, which on a 393px phone pokes
   a couple of pixels past the viewport and gives the page a horizontal
   scrollbar for part of every revolution. The star is drawn inside a box that
   never moves; fill-box makes the path spin about its own centre. */
.burst svg path{transform-box:fill-box; transform-origin:50% 50%;
                animation:turn 24s linear infinite; will-change:transform}
/* On the sibling, not on a child of the svg: the word does not turn with the
   star. Its own tilt is a fixed one, the way a sticker is put on by hand.
   The slant is a skewX, not font-style: PP Neue Montreal ships as one upright
   face, so an italic request gets the browser's synthetic oblique at about 14
   degrees, which is enough to stop looking like the typeface. Ten degrees of
   our own reads as a slant instead of as a different font. */
.burst b{position:relative; font-family:var(--font-bold); font-weight:700;
         font-size:calc(var(--burst) * 0.25); line-height:1;
         letter-spacing:-.02em; color:var(--paper);
         transform:rotate(9deg) skewX(-9deg)}
@keyframes turn{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .rig,.sway,.cast,.burst svg path{animation:none}
  .box{transition:none}
}
</style>
</head>
<body>

<canvas class="shade" id="shade" aria-hidden="true"></canvas>

<!-- Outside the box, not in it. It is fixed, so it sits in the same place
     either way; what keeps it above the box is its z-index, not its place in
     the markup. -->
<header class="bar">
  <button class="pre" type="button" disabled aria-disabled="true">pre-order</button>
</header>

<section class="bento" id="bento">
<canvas class="vig" id="vig" aria-hidden="true"></canvas>
<div class="wash" aria-hidden="true">
  <video preload="auto" autoplay muted loop playsinline>
    <source src="media/ground.mp4" type="video/mp4">
    <source src="media/ground.webm" type="video/webm">
  </video>
</div>

<main class="sheet">
  <div class="say">
    <div class="title">
      <video class="film" id="film" preload="auto"
             autoplay muted loop playsinline aria-hidden="true">

<script src="camera-element.js"></script>
<script>
// The loop is the product: it sleeps, and sleeping is where it spends its life.
// Every few seconds it stirs, turns over, does one thing, and goes back down.
// Screens are real frames from the firmware's preview renderer.

const STATES = [
  { label: 'asleep',     screen: 'sleepA',     hold: 9000, breathes: true },
  { label: 'viewfinder', screen: 'viewfinder', hold: 3400 },
  { label: 'posted',     screen: 'gallery',    hold: 3400 },
];

// Fit the headline by measuring it rather than predicting it: the widest line
// is set to exactly the block's width in whatever font actually resolved.
// Runs before the first paint, again once fonts settle, and on resize.
const h1 = document.querySelector('h1');
function fitHeadline() {
  const avail = h1.parentElement.clientWidth;
  if (!avail) return;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px';
  h1.appendChild(probe);
  let widest = 0;
  for (const line of h1.children) {
    if (line === probe) continue;
    probe.textContent = line.textContent;
    widest = Math.max(widest, probe.getBoundingClientRect().width);
  }
  h1.removeChild(probe);
  if (widest > 0) h1.style.fontSize = 100 * avail / widest + 'px';
}
// Cut the film down to the lines themselves. One mask layer per line, each
// placed and sized from that line's own box, so the film shows up as three
// bands hugging the words rather than one rectangle behind them.
function maskLines(){
  const film = document.getElementById('film');
  if (!film || !h1.children.length) return;
  const box = film.getBoundingClientRect();
  if (!box.width) return;
  const bleed = parseFloat(getComputedStyle(h1).fontSize) * 0.11;
  const layers = [], pos = [], size = [];
  for (const line of h1.children){
    const r = line.getBoundingClientRect();
    layers.push('linear-gradient(#000,#000)');
    pos.push(Math.round(r.left - box.left) + 'px ' +
             Math.round(r.top - box.top - bleed) + 'px');
    size.push(Math.ceil(r.width) + 'px ' + Math.ceil(r.height + bleed * 2) + 'px');
  }
  for (const k of ['webkitMask', 'mask']){
    film.style[k + 'Image'] = layers.join(',');
    film.style[k + 'Position'] = pos.join(',');
    film.style[k + 'Size'] = size.join(',');
    film.style[k + 'Repeat'] = 'no-repeat';
  }
}

function fitAndMask(){ fitHeadline(); maskLines(); }
fitAndMask();
addEventListener('resize', fitAndMask);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAndMask);

const stage = document.querySelector('.stage');
const screenImg = document.getElementById('screen');
const still = matchMedia('(prefers-reduced-motion: reduce)');

const SPIN_MS = 1250;   // one full turn
const SWAP_MS = 620;    // halfway, with its back to us: nobody sees the cut
const PHONE_MS = 5200;  // two flicks of the blog before it turns back
const BREATH_MS = 1000; // the firmware breathes on its 5s tick; a frame a second reads better here
const FIRST_MS = 2000;  // the first turn comes quickly, so the page shows what it does

// ---- the dithered render ---------------------------------------------------
//
// The device is raymarched as a signed distance field rather than assembled
// from CSS faces, because the whole point is to dither it, and a dither has to
// live on the pixel grid. A CSS pattern would rotate and foreshorten with the
// object and read as printed-on texture. Here the shading is computed per
// pixel and thresholded against the same 4x4 Bayer matrix the firmware uses
// for its viewfinder, so the object is rendered exactly the way the camera
// renders the world. One dither dot is one CSS pixel, which on a phone works
// out close to the physical pixel pitch of the real 400x240 panel.


// One source of truth for the two colours: the stylesheet.
function cssColour(name){
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const dec = raw.match(/^rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/);
  if (dec) return [dec[1], dec[2], dec[3]].map((n) => n / 255);
  let hex = raw.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
  return [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
}

const SCREENS = window.LC_SCREENS;
const cam = document.getElementById('gl');
let glReady = false;




// Where this canvas sits in the viewport, so the shader can index the page's
// vignette and dither grid rather than its own. Read every frame: the sheet
// moves under it whenever the headline is refitted or the page scrolls, and a
// stale origin shows immediately as a rectangle of mismatched ground.
// The box is the origin both canvases share -- for the dither lattice and for
// the vignette, which is centred on the box rather than the viewport now. Its
// size is rounded up: the header's height is set by font metrics and lands on
// fractions, and half a pixel of scaling would smear the dither. The extra
// pixel is under the box's own clip.
function bentoBox(){
  const b = document.getElementById('bento').getBoundingClientRect();
  return {left:b.left, top:b.top,
          w:Math.max(1, Math.ceil(b.width)), h:Math.max(1, Math.ceil(b.height))};
}



// The same vignette the shader applies, painted across the box and dithered
// with the same matrix on the same box-aligned grid. It only changes when the
// window does, so a per-pixel pass in JS is cheap enough.
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const VIG = 0.30, VIG_IN = 0.70;
const bayer = (x, y) =>
  (4 * BAYER4[((y & 3) << 2) | (x & 3)] +
   [[0, 2], [3, 1]][(y >> 2) & 1][(x >> 2) & 1] + 0.5) / 64;

function paintVignette(){
  const cv = document.getElementById('vig');
  const {w, h} = bentoBox();
  if (cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    // CSS size too, and the same integers: left to stretch to the box it would
    // be resampled onto a fractional width and the dots would smear.
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
  }
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const ink = cssColour('--ink').map((v) => Math.round(v * 255));
  const paper = cssColour('--paper').map((v) => Math.round(v * 255));
  const img = ctx.createImageData(w, h), d = img.data;
  const cx = w / 2, cy = h / 2, R = 0.5 * Math.hypot(w, h);
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const t = Math.hypot(x - cx, y - cy) / R;
      const lum = 1 - VIG * Math.min(1, Math.max(0, (t - VIG_IN) / (1 - VIG_IN)));
      const c = lum > bayer(x, y) ? paper : ink;
      const i = (y * w + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// The box's drop shadow, on the same Bayer grid as everything else. A 2D
// rounded-box distance field gives the falloff; the threshold turns it into
// dots. Indexed in box coordinates, not page ones, so its dots line up with the
// ground's inside the box however wide the gutter is.
// Below the box only -- nothing up the sides or over the top, so it reads as
// the box sitting on the page rather than floating off it.
const SHADE_REACH = 10;    // how far it carries below the edge, px
// Low, because this is a dot count, not a grey. At 0.72 the first row below
// the box came out ~72% covered, which on a 1px-pitch dither is a solid black
// rule, not a shadow: the page's own darkest ground is nearer a third.
const SHADE_MAX = 0.34;    // darkness right at the edge

function sdRoundBox(px, py, cx, cy, hw, hh, r){
  const qx = Math.abs(px - cx) - (hw - r), qy = Math.abs(py - cy) - (hh - r);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
}

function paintShade(){
  const cv = document.getElementById('shade');
  const el = document.getElementById('bento');
  const b = el.getBoundingClientRect();
  const r = parseFloat(getComputedStyle(el).borderRadius) || 0;
  // Only the strip under the box, not the whole viewport: the shadow never
  // reaches further than SHADE_REACH, and this keeps the per-pixel pass to a
  // few thousand pixels instead of a few hundred thousand.
  // Held inside the page's own margin: a decoration hanging past it is what
  // the document scrolls for, and two stray pixels are a pair of scrollbars.
  const pad = Math.min(SHADE_REACH, Math.floor(parseFloat(getComputedStyle(document.body).paddingBottom)));
  const w = Math.max(1, Math.ceil(b.width) + pad * 2), h = Math.max(1, pad);
  if (cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
  }
  // Document coordinates, so it scrolls with the box rather than with the view.
  const ox = Math.round(b.left) - pad, oy = Math.round(b.bottom);
  cv.style.left = (ox + scrollX) + 'px';
  cv.style.top = (oy + scrollY) + 'px';

  const ctx = cv.getContext('2d');
  if (!ctx) return;
  ctx.clearRect(0, 0, w, h);
  const ink = cssColour('--ink').map((v) => Math.round(v * 255));
  const img = ctx.createImageData(w, h), d = img.data;
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const hw = b.width / 2, hh = b.height / 2;
  // The strip starts at the box's bottom edge, so nothing is drawn up the
  // sides or over the top. The distance field is the box's own, so the band
  // still curves round the two bottom corners.
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const vx = ox + x + 0.5, vy = oy + y + 0.5;   // viewport coordinates
      const dist = sdRoundBox(vx, vy, cx, cy, hw, hh, r);
      if (dist <= 0 || dist >= SHADE_REACH) continue;
      const t = 1 - dist / SHADE_REACH;
      const lum = SHADE_MAX * t * t;
      // Indexed off the box's own origin, so these dots land on the same
      // lattice as the ground's inside it.
      if (lum <= bayer(ox + x - Math.round(b.left), oy + y - Math.round(b.top))) continue;
      const i = (y * w + x) * 4;
      d[i] = ink[0]; d[i + 1] = ink[1]; d[i + 2] = ink[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}


function setScreen(key){
  if (glReady) cam.scene(key);
  else screenImg.src = SCREENS[key];
}

// ---- the loop --------------------------------------------------------------
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let spinTo = 0;

// Every turn comes out as the other thing. The canvas has to grow for the
// phone, and it does that at the edge-on frame, which is the one with nothing
// to show. Without WebGL there is no phone, only the CSS box turning.
function turn(){
  if (!glReady){
    document.getElementById('box').style.setProperty('--spin', (spinTo += 360) + 'deg');
    return;
  }
  const at = cam.morph();
  if (at) setTimeout(() => stage.classList.toggle('phone', cam.phone), at);
}

async function run(){
  let i = 0, first = true;
  for (;;){
    const s = STATES[i];
    screenImg.alt = "The camera's screen: " + s.label;
    setScreen(s.screen);

    let breath;
    if (s.breathes && !still.matches){
      let out = false;
      breath = setInterval(() => { out = !out; setScreen(out ? 'sleepB' : 'sleepA'); }, BREATH_MS);
    }

    await wait(first ? FIRST_MS : s.hold);
    first = false;
    if (breath) clearInterval(breath);

    i = (i + 1) % STATES.length;
    const next = STATES[i].screen;

    if (still.matches){ setScreen(next); continue; }

    if (!glReady){
      turn();
      await wait(SWAP_MS);
      setScreen(next);
      await wait(SPIN_MS - SWAP_MS);
      continue;
    }

    turn();
    await wait(SPIN_MS + PHONE_MS);
    // Swapped behind the phone's back, so it comes out wearing the next face.
    setScreen(next);
    turn();
    await wait(SPIN_MS);
  }
}

// Load every frame up front, then start: the first turn must never land on a
// blank panel, and the renderer needs a texture before its first draw.
let pending = 0;
for (const [key, src] of Object.entries(SCREENS)){
  const img = new Image();
  pending++;
  img.onload = img.onerror = () => { if (--pending === 0) start(); };
  img.src = src;
}

function start(){
  cam.box = bentoBox;
  cam.still = still.matches;
  cam.palette(cssColour('--ink'), cssColour('--paper'));
  glReady = cam.ready;
  paintVignette(); paintShade();
  addEventListener('resize', () => { paintVignette(); paintShade(); });
  // Autoplay is refused in low power mode even when muted and inline, so the
  // first touch anywhere starts it instead. Nothing depends on it playing.
  if (!still.matches){
    const films = document.querySelectorAll('video');
    const kick = () => films.forEach((v) => v.play().catch(() => {}));
    kick();
    addEventListener('touchstart', kick, { once: true, passive: true });
    addEventListener('click', kick, { once: true });
  }
  if (glReady){
    stage.classList.add('gl-on');
    cam.scene('sleepA');
  }
  run();
}
</script>
