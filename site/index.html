<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Camera</title>
<meta name="description" content="A small black-and-white camera that sleeps, breathes and posts to its own tiny blog.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#dddddd">
<meta property="og:title" content="A Little Camera">
<meta property="og:description" content="A small black-and-white camera that sleeps, breathes and posts to its own tiny blog.">
<meta property="og:type" content="website">

<style>
/* lttl.cam — teaser.
   Ground and type are Amaranth Studio's: #ddd paper, PP Neue Montreal. The
   font files are licensed and live beside this page in fonts/; nothing else
   can serve them, so the stack falls back to the nearest grotesque and the
   headline measures whatever actually resolved (see the script). The headline
   is the one place that departs from the micro-blog's tiny tracked caps — at
   display size a bold grotesque wants tight tracking, not wide. */
@font-face{font-family:"PP Neue Montreal Book";
  src:url("fonts/ppneuemontreal-book.woff") format("woff");
  font-weight:400; font-style:normal; font-display:swap}
@font-face{font-family:"PP Neue Montreal Bold";
  src:url("fonts/ppneuemontreal-bold.woff") format("woff");
  font-weight:700; font-style:normal; font-display:swap}
:root{
  --ink:#000; --paper:#ddd; --rule:1px solid #000;
  --font:"PP Neue Montreal Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-bold:"PP Neue Montreal Bold","PP Neue Montreal Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --shell:#dadada; --shell-lit:#efefef; --shell-dim:#c3c3c3;
  --glass:#fff; --cast:0,0,0;
  --pad-x:clamp(20px, 5vw, 72px);
  /* The block: as wide as the screen allows, capped so it stays whole above
     the fold on a laptop. The headline is fitted to it at runtime (see the
     script): sizing it by calculation meant guessing the font's metrics, and
     Helvetica Neue Bold on iOS is a shade wider than Helvetica or Arial, so
     its longest line wrapped there and the three lines became four. The
     factor below is only the pre-script fallback, deliberately short. */
  --sheet:min(calc(100vw - var(--pad-x) * 2), 480px, 54vh);
  /* The 2.7" Sharp panel is 57.6 x 34.56 mm of glass. A 1.75 mm bezel all
     round makes the device 61.1 x 38.1 x 7 mm: all screen, no button, and one
     small lens on the back. Every proportion below comes off that rectangle. */
  --w:calc(var(--sheet) * 0.63);
  --h:calc(var(--w) * 0.6229);
  --d:calc(var(--w) * 0.1146);
  --r:calc(var(--w) * 0.057);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%}
body{
  min-height:100%; margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font);
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding-block:clamp(32px,7vmin,72px);
  padding-left:var(--pad-x); padding-right:var(--pad-x);
}
img{max-width:100%}

.sheet{width:var(--sheet); margin-inline:auto;
       display:flex; flex-direction:column; align-items:flex-start;
       gap:calc(var(--sheet) * 0.12)}

/* Lower case, like every heading on amaranthstudio.com. The micro-blog's
   tracked capitals are right at 10px and wrong at 90. */
h1{margin:0; text-align:left; font-family:var(--font-bold);
   font-size:calc(var(--sheet) * 0.168); line-height:.98; font-weight:700;
   letter-spacing:-.012em}
/* Each line is its own block and never wraps, so three lines stay three lines
   whatever the font turns out to be. */
h1 span{display:block; white-space:nowrap}

/* ---- the void ---- */
.stage{position:relative; width:var(--w); align-self:center;
       display:flex; align-items:center; justify-content:center;
       perspective:1500px; perspective-origin:50% 45%;
       min-height:calc(var(--h) + var(--w) * 0.26)}
.rig{transform-style:preserve-3d; animation:bob 6.5s ease-in-out infinite; will-change:transform}
/* It is always turning a little, so the full turn below reads as more of the
   same motion rather than something switching on. */
.sway{transform-style:preserve-3d; animation:sway 11s ease-in-out infinite; will-change:transform}
.cast{position:absolute; left:50%; bottom:calc(var(--w) * 0.02);
      width:calc(var(--w) * 0.8); height:calc(var(--w) * 0.09);
      border-radius:50%; background:rgb(var(--cast));
      filter:blur(calc(var(--w) * 0.045));
      animation:cast 6.5s ease-in-out infinite; will-change:transform,opacity}

@keyframes bob{0%,100%{transform:translateY(calc(var(--w) * -0.022)) rotate(-.5deg)}
               50%   {transform:translateY(calc(var(--w) *  0.022)) rotate(.5deg)}}
@keyframes sway{0%,100%{transform:rotateY(-11deg) rotateX(-3.5deg)}
                50%   {transform:rotateY(10deg)  rotateX(3.5deg)}}
@keyframes cast{0%,100%{transform:translateX(-50%) scale(1.08); opacity:.12}
                50%   {transform:translateX(-50%) scale(.9);   opacity:.25}}

/* ---- the device ---- */
.box{position:relative; width:var(--w); height:var(--h); transform-style:preserve-3d;
     transform:rotateX(-5deg) rotateY(var(--spin,0deg));
     transition:transform 1.25s cubic-bezier(.62,.02,.34,1)}
.slice{position:absolute; left:0; top:0; width:var(--w); height:var(--h);
       border-radius:var(--r); transform:translateZ(calc(var(--d) * var(--z)))}
/* The one thing on the back: a small lens, about 7 mm across. */
.lens{position:absolute; left:12%; top:20%; width:11%; aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle at 38% 34%,#4c4c4c 0%,#1a1a1a 44%,#080808 100%);
      box-shadow:0 0 0 calc(var(--w) * .008) var(--shell-dim),
                 0 0 0 calc(var(--w) * .0115) rgba(0,0,0,.2)}
.lens::after{content:""; position:absolute; left:25%; top:19%; width:23%; aspect-ratio:1;
             border-radius:50%; background:rgba(255,255,255,.62)}

.slab{position:absolute; left:0; top:0; width:var(--w); height:var(--h);
      border-radius:var(--r); backface-visibility:hidden;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.front{transform:translateZ(calc(var(--d) / 2));
       background:linear-gradient(158deg,var(--shell-lit) 0%,var(--shell) 52%,var(--shell-dim) 100%)}
.back{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));
      background:linear-gradient(202deg,var(--shell-lit) 0%,var(--shell) 58%,var(--shell-dim) 100%)}

/* The panel, 1.75 mm of bezel on every side, with corners of its own. */
.screen{position:absolute; inset:4.6% 2.86%;
        border:var(--rule); border-radius:calc(var(--r) * .5);
        background:var(--glass); overflow:hidden}
.screen img{display:block; width:100%; height:100%; image-rendering:pixelated;
            border-radius:calc(var(--r) * .44)}

/* The dithered render. When WebGL comes up it takes over and the CSS device
   below is hidden; if it doesn't, the CSS device stays and nothing is lost. */
.gl{position:absolute; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges}
.stage:not(.gl-on) .gl{display:none}
.gl-on .rig,.gl-on .cast{display:none}

@media (prefers-reduced-motion:reduce){
  .rig,.sway,.cast{animation:none}
  .box{transition:none}
}
</style>
</head>

// Fit the headline by measuring it rather than predicting it: the widest line
// is set to exactly the block's width in whatever font actually resolved.
// Runs before the first paint, again once fonts settle, and on resize.
const h1 = document.querySelector('h1');
function fitHeadline() {
  const avail = h1.parentElement.clientWidth;
  if (!avail) return;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px';
  h1.appendChild(probe);
  let widest = 0;
  for (const line of h1.children) {
    if (line === probe) continue;
    probe.textContent = line.textContent;
    widest = Math.max(widest, probe.getBoundingClientRect().width);
  }
  h1.removeChild(probe);
  if (widest > 0) h1.style.fontSize = 100 * avail / widest + 'px';
}
fitHeadline();
addEventListener('resize', fitHeadline);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeadline);

// ---- the dithered render ---------------------------------------------------
//
// The device is raymarched as a signed distance field rather than assembled
// from CSS faces, because the whole point is to dither it, and a dither has to
// live on the pixel grid. A CSS pattern would rotate and foreshorten with the
// object and read as printed-on texture. Here the shading is computed per
// pixel and thresholded against the same 4x4 Bayer matrix the firmware uses
// for its viewfinder, so the object is rendered exactly the way the camera
// renders the world. One dither dot is one CSS pixel, which on a phone works
// out close to the physical pixel pitch of the real 400x240 panel.
const VERT = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uViewH;    // world height visible at the object plane
uniform float uYaw, uPitch, uBob;
uniform sampler2D uScreen;
uniform vec3  uInk, uGround;

const float CAM_Z  = 4.0;
const vec3  HALF   = vec3(0.5, 0.3118, 0.0573);   // 61.1 x 38.1 x 7 mm, width = 1
const float ROUND  = 0.0573;                      // 3.5 mm corner, fully round edge
const vec2  SCR    = vec2(0.4714, 0.2828);        // 57.6 x 34.56 mm of glass
const float ALBEDO = 0.88;
const float AMB    = 0.62;

mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }

float sdBox(vec3 p){
  vec3 q = abs(p) - (HALF - ROUND);
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - ROUND;
}

vec3 nrm(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(sdBox(p+e.xyy)-sdBox(p-e.xyy),
                        sdBox(p+e.yxy)-sdBox(p-e.yxy),
                        sdBox(p+e.yyx)-sdBox(p-e.yyx)));
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.03;
  for (int i = 0; i < 28; i++){
    float h = sdBox(ro + rd*t);
    res = min(res, 9.0*h/t);
    t += clamp(h, 0.02, 0.35);
    if (res < 0.004 || t > 5.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float bayer(vec2 q){
  int x = int(mod(q.x, 4.0)), y = int(mod(q.y, 4.0));
  int i = y*4 + x;
  float m = 0.0;
  // The firmware's BAYER4, same order (display.cpp).
  if(i==0)m=0.;else if(i==1)m=8.;else if(i==2)m=2.;else if(i==3)m=10.;
  else if(i==4)m=12.;else if(i==5)m=4.;else if(i==6)m=14.;else if(i==7)m=6.;
  else if(i==8)m=3.;else if(i==9)m=11.;else if(i==10)m=1.;else if(i==11)m=9.;
  else if(i==12)m=15.;else if(i==13)m=7.;else if(i==14)m=13.;else m=5.;
  return (m + 0.5) / 16.0;
}

void main(){
  vec2 q = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.0, -0.045, CAM_Z);
  vec3 rd = normalize(vec3(q * uViewH, -CAM_Z));

  mat3 inv = rotX(-uPitch) * rotY(-uYaw);      // world -> object
  vec3 pivot = vec3(0.0, uBob, 0.0);
  vec3 ro_o = inv * (ro - pivot);
  vec3 rd_o = inv * rd;
  vec3 L    = normalize(vec3(-0.5, 0.62, 0.6));
  vec3 L_o  = inv * L;

  float lum = 1.0;                              // the void is paper
  float t = 0.0;
  bool hit = false;
  for (int i = 0; i < 72; i++){
    float d = sdBox(ro_o + rd_o*t);
    if (d < 0.0008){ hit = true; break; }
    t += d;
    if (t > 11.0) break;
  }

  if (hit){
    vec3 p = ro_o + rd_o*t;
    vec3 n = nrm(p);
    if (n.z > 0.5 && abs(p.x) < SCR.x && abs(p.y) < SCR.y){
      // The panel is 1-bit in real life, so it is not shaded. Sampling it
      // smoothly and then dithering re-screens the photograph at render
      // resolution instead of moireing the one it already carries.
      vec2 uv = vec2(p.x/(2.0*SCR.x) + 0.5, 0.5 - p.y/(2.0*SCR.y));
      lum = texture2D(uScreen, uv).r;
    } else {
      float dif = max(dot(n, L_o), 0.0);
      float sh  = softShadow(p + n*0.005, L_o);
      float rim = pow(1.0 - max(dot(n, -rd_o), 0.0), 3.0);
      lum = ALBEDO * (AMB + (1.0 - AMB) * dif * sh) + 0.05 * rim;
    }
  } else {
    // A soft ellipse beneath the device rather than a shadow cast on a floor.
    // The void has no floor, and a plane seen at this grazing an angle smears
    // the shadow into a streak running to the horizon. It widens and lightens
    // as the camera rises, which is what sells the float.
    vec2 c = vec2(0.0, -0.355);
    vec2 rad = vec2(0.46, 0.055) * (1.0 + uBob * 3.5);
    float d = length((q - c) / rad);
    lum = 1.0 - 0.26 * (1.0 - smoothstep(0.0, 1.0, d)) * (1.0 - uBob * 5.0);
  }

  // Two levels only, and they are the page's own ink and paper, so the void
  // the render sits in is exactly the background behind the canvas.
  float v = lum > bayer(gl_FragCoord.xy) ? 1.0 : 0.0;
  gl_FragColor = vec4(mix(uInk, uGround, v), 1.0);
}`;

// One source of truth for the two colours: the stylesheet.
function cssColour(name){
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const dec = raw.match(/^rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/);
  if (dec) return [dec[1], dec[2], dec[3]].map((n) => n / 255);
  let hex = raw.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
  return [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
}

const IMG = {};
let gl = null, uni = {}, tex = null, glReady = false;

function compile(g, type, src){
  const sh = g.createShader(type);
  g.shaderSource(sh, src);
  g.compileShader(sh);
  if (!g.getShaderParameter(sh, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(sh));
  return sh;
}

function initGL(){
  const cv = document.getElementById('gl');
  const g = cv.getContext('webgl', { antialias: false, alpha: false });
  if (!g) return false;
  const pr = g.createProgram();
  g.attachShader(pr, compile(g, g.VERTEX_SHADER, VERT));
  g.attachShader(pr, compile(g, g.FRAGMENT_SHADER, FRAG));
  g.linkProgram(pr);
  if (!g.getProgramParameter(pr, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(pr));
  g.useProgram(pr);

  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(pr, 'p');
  g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);

  for (const n of ['uRes','uViewH','uYaw','uPitch','uBob','uScreen','uInk','uGround'])
    uni[n] = g.getUniformLocation(pr, n);

  tex = g.createTexture();
  g.bindTexture(g.TEXTURE_2D, tex);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
  g.uniform1i(uni.uScreen, 0);
  g.uniform3fv(uni.uInk, cssColour('--ink'));
  g.uniform3fv(uni.uGround, cssColour('--paper'));
  gl = g;
  return true;
}

function sizeGL(){
  const cv = document.getElementById('gl');
  const r = cv.getBoundingClientRect();
  // One dither dot per CSS pixel: close to the real panel's pitch on a phone,
  // and it keeps the pattern crisp when the browser scales it to device pixels.
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uni.uRes, w, h);
  gl.uniform1f(uni.uViewH, (1.0 / 0.94) / (w / h));   // device spans 94% of the width
}

function uploadScreen(key){
  const img = IMG[key];
  if (!gl || !img || !img.complete) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
}

function setScreen(key){
  if (glReady) uploadScreen(key);
  else screenImg.src = SCREENS[key];
}

// ---- the loop --------------------------------------------------------------
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const RAD = Math.PI / 180;

let spinFrom = 0, spinTo = 0, spinAt = -1e9;

function draw(now){
  const spun = Math.min(1, Math.max(0, (now - spinAt) / SPIN_MS));
  const yaw = (spinFrom + (spinTo - spinFrom) * ease(spun)) * RAD
            + Math.sin(now / 11000 * 2 * Math.PI) * 10.5 * RAD;
  const pitch = (-5 + Math.sin(now / 11000 * 2 * Math.PI) * 3.5) * RAD;
  const bob = Math.sin(now / 6500 * 2 * Math.PI) * 0.022;
  gl.uniform1f(uni.uYaw, still.matches ? spinTo * RAD : yaw);
  gl.uniform1f(uni.uPitch, still.matches ? -5 * RAD : pitch);
  gl.uniform1f(uni.uBob, still.matches ? 0 : bob);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(draw);
}

async function run(){
  let i = 0;
  for (;;){
    const s = STATES[i];
    screenImg.alt = "The camera's screen: " + s.label;
    setScreen(s.screen);

    let breath;
    if (s.breathes && !still.matches){
      let out = false;
      breath = setInterval(() => { out = !out; setScreen(out ? 'sleepB' : 'sleepA'); }, BREATH_MS);
    }

    await wait(s.hold);
    if (breath) clearInterval(breath);

    i = (i + 1) % STATES.length;
    const next = STATES[i].screen;

    if (still.matches){ setScreen(next); continue; }

    if (glReady){
      spinFrom = spinTo; spinTo = spinFrom + 360; spinAt = performance.now();
    } else {
      document.getElementById('box').style.setProperty('--spin', spinTo + 360 + 'deg');
      spinTo += 360;
    }
    await wait(SWAP_MS);
    setScreen(next);
    await wait(SPIN_MS - SWAP_MS);
  }
}

// Load every frame up front, then start: the first turn must never land on a
// blank panel, and the renderer needs a texture before its first draw.
let pending = 0;
for (const [key, src] of Object.entries(SCREENS)){
  const img = new Image();
  IMG[key] = img;
  pending++;
  img.onload = img.onerror = () => { if (--pending === 0) start(); };
  img.src = src;
}

function start(){
  try {
    if (!still.matches || true) glReady = initGL();
  } catch (e){ glReady = false; }
  if (glReady){
    stage.classList.add('gl-on');
    sizeGL();
    uploadScreen('sleepA');
    addEventListener('resize', () => { sizeGL(); });
    requestAnimationFrame(draw);
  }
  run();
}
</script>
</body>
</html>
