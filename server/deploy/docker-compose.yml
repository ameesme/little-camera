# Little Camera micro-blog on one VPS.
#
#   cp .env.example .env   # fill in DOMAIN, SESSION_SECRET, SMTP_URL, DNS token
#   docker compose up -d --build
#
# Caddy terminates TLS for the apex and every subdomain with one wildcard
# certificate. Wildcards need the DNS-01 challenge via Vercel DNS (VERCEL_API_TOKEN).
#
# On the shared domain Caddy forwards only /api/* and /app/* here; the root is the landing page from LANDING_DIR.

services:
  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE_DOMAIN: ${DOMAIN}
      PUBLIC_SCHEME: https
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Little Camera <camera@${DOMAIN}>}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Amsterdam}
      # On the volume rather than in the image, so publishing a release is a copy and an edit (protocol §4.7).
      FIRMWARE_DIR: /data/firmware
    volumes:
      - data:/data
    expose:
      - "3000"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LANDING_DIR:-../../site}:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
