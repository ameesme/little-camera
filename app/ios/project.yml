# XcodeGen spec. `xcodegen generate` writes LittleCamera.xcodeproj (git-ignored).
name: LittleCamera
options:
  bundleIdPrefix: me.amees
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

schemes:
  LittleCamera:
    build:
      targets:
        LittleCamera: all

targets:
  LittleCamera:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LittleCamera
      # The device in the WKWebView is the landing page's <little-camera>, the
      # same file rather than a copy of it. Both land flat in the bundle, which
      # is what device.html's relative import expects.
      - path: ../../site/camera-element.js
        buildPhase: resources
      # The blog the phone scrolls in the intro, the landing page's own strip.
      - path: ../../site/media/blog-strip.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.amees.littlecamera
        PRODUCT_NAME: LittleCamera
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only; there is no iPad layout.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LittleCamera/Info.plist
      properties:
        CFBundleDisplayName: Little Camera
        CFBundleName: LittleCamera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # bluetooth-central is what lets iOS relaunch us in the background when the
        # camera advertises again and a connect is pending (see CameraLink.swift).
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Little Camera talks to your camera over Bluetooth to pull photos off it, also while the app is in the background.
        NSPhotoLibraryAddUsageDescription: Saving a picture off the little blog puts it in your photos.
        # White launch screen, no storyboard. Paper is a white colour set in Assets.
        UILaunchScreen:
          UIColorName: Paper
        ITSAppUsesNonExemptEncryption: false
        # LAN testing over plain http: nip.io resolves <ip>.nip.io, and any label under it, to that ip.
        NSAppTransportSecurity:
          NSExceptionDomains:
            nip.io:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # The app is black on white and nothing else; do not let dark mode invert it.
        UIUserInterfaceStyle: Light
