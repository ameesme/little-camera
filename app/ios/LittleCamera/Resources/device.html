<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  little-camera { position:fixed; inset:0; }
</style>
<little-camera id="cam" span="0.95" phone-span="0.9"></little-camera>
<script src="camera-element.js"></script>
<script>
  // Swift talks to the element through window.lc (UI/Device/DeviceView.swift).
  const cam = document.getElementById('cam');
  window.lc = {
    scene: (key) => cam.scene(key),
    spin: (degrees) => cam.spin(degrees),
    turnTo: (key) => cam.turnTo(key),
    // The element hands back the edge-on moment, which is the only frame with nothing to show: swapping the panel any earlier shows the next screen on the old shape.
    morph: (on, key) => { const at = cam.morph(on); at ? setTimeout(() => cam.scene(key), at) : cam.scene(key); },
    celebrate: () => cam.celebrate(),
    breathing: (on) => { cam.breathing = !!on; },
    reset: () => cam.reset(),
    // A data URL, because a file:// image is an opaque origin and WebGL refuses to take one.
    strip: (src) => cam.setAttribute('strip', src),
    photo: (src) => cam.photo(src),
  };
</script>
