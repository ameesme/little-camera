; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:v3q]
platform = espressif32 @ 8.0.0   ; Arduino core 3.3.12, what selftest/ was checked against
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16MB quad flash + 8MB octal PSRAM. The generic S3
; board, not seeed_xiao_esp32s3: that definition declares 8MB and ships a
; pins_arduino.h putting LED_BUILTIN on GPIO21, which is CAM_D6 here.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio

; PSRAM deliberately left un-initialised: nothing in the app uses it. The camera
; framebuffer is explicitly CAMERA_FB_IN_DRAM and internal RAM sits at a
; quarter, while an initialised octal PSRAM has to be held in self-refresh
; through every light sleep. `qio_qspi` probes in quad mode, which the octal
; part does not answer, so esp_psram_init() fails and nothing is enabled — the
; "PSRAM init failed!" line at boot is the intended outcome, not a fault. Revert
; to `qio_opi` + -DBOARD_HAS_PSRAM the moment anything wants the 8MB.
; selftest/ still builds qio_opi, so the part is proven populated there.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Frozen: photos live in this table's `spiffs` entry and a different table
; would move or erase them. Still 8MB on a 16MB part, so roughly half the
; flash is unreachable — the open question in AGENTS.md, to settle before
; v3q boards carry photos worth keeping.
board_build.partitions = default_8MB.csv

; NimBLE rather than Bluedroid: about a third of the flash and RAM, and the
; 2.x API is what src/sync.cpp is written against (callbacks take
; NimBLEConnInfo&, notify() returns bool). Pinned to a major.
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Peripheral only: the camera never scans or connects out. Trims the host.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; Uncomment to build without the radio when bisecting a problem:
  ; -DLC_NO_BLE
  ; Uncomment to run the mood clock 600x (an hour in 6s, the week in ~17min)
  ; for bench-testing docs/mood.md. Also makes the mood write NVS every 1.5s.
  ; -DLC_MOOD_FAST
