; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:xiao_shutter]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; XIAO ESP32-S3: 8MB QIO flash + 8MB OPI PSRAM (board def sets memory type)
; The partition table is frozen: photos live in its `spiffs` entry and a
; different table would move or erase them. See AGENTS.md.
board_build.partitions = default_8MB.csv

; NimBLE rather than Bluedroid: about a third of the flash and RAM, and the
; 2.x API is what src/sync.cpp is written against (callbacks take
; NimBLEConnInfo&, notify() returns bool). Pinned to a major.
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Peripheral only: the camera never scans or connects out. Trims the host.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; Uncomment to build without the radio when bisecting a problem:
  ; -DLC_NO_BLE
