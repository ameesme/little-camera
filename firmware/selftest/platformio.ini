; little camera v3q board self-test.
;
; Standalone on purpose: it shares no code with ../src, so a failing board
; points at the hardware (or at this one file), not at the app. The pin map is
; the v3q netlist (little_camera_v3/gen/design.py), not the XIAO carrier.
;
;   cd firmware/selftest
;   pio run -t upload -t monitor
;
; Then follow the screen: press the shutter for the next test, hold it for
; the action named at the bottom. Type `?` in the monitor for serial commands.

[env:v3q_selftest]
platform = espressif32 @ 8.0.0   ; Arduino core 3.3.12, the version this was built and checked against
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash + 8 MB octal PSRAM. The XIAO
; board definition (8 MB, and its own pins_arduino.h with LED_BUILTIN on
; GPIO21, which is CAM_D6 here) no longer fits, so this uses the generic S3.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Same table as the app (../platformio.ini) so the photo partition sits where
; the real firmware will expect it after the self-test.
board_build.partitions = default_8MB.csv

monitor_speed = 115200

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
